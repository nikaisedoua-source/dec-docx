<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DEC DOCX converts raw text and DOCX sources into clean Word documents.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DEC DOCX">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?build=1.9.10">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?build=1.9.10"/>

  <title>DEC DOCX</title>
  <link rel="canonical" href="https://nikaisedoua-source.github.io/dec-docx/">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Old shared links open the same current app, without a version URL.
    const appUrl = new URL(window.location.href);
    if (appUrl.searchParams.has('v')) {
      appUrl.searchParams.delete('v');
      history.replaceState(null, '', appUrl.pathname + appUrl.search + appUrl.hash);
    }
  </script>
  <script src="cloud_storage.js?build=1.9.10"></script>
  <script>
    window.decExtractPdfText = async (bytes) => {
      const reader = await import(new URL('pdf_extract.mjs?build=1.9.10', document.baseURI).href);
      return reader.extractPdfText(bytes);
    };
  </script>
  <script src="flutter_bootstrap.js?build=1.9.10" async></script>
</body>
</html>
