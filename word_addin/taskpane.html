<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DEC DOCX</title>
    <link rel="stylesheet" href="taskpane.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="brand"><span class="mark">D</span><div><strong>DEC DOCX</strong><small>Contrôle Word</small></div></header>
      <section class="card">
        <span class="eyebrow">FLUX WORD DIRECT</span>
        <h1>Traiter la sélection</h1>
        <p class="muted">Sélectionne les versets dans Word. DEC DOCX les prépare dans une fenêtre, puis insère le DOCX formaté exactement à la place de la sélection.</p>
        <div class="actions">
          <button id="open-app" class="primary">Envoyer à DEC DOCX</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="taskpane.js"></script>
  </body>
</html>
