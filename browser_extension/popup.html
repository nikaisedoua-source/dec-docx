<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DEC DOCX</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header><img src="assets/icon-48.png" alt="" /><div><strong>DEC DOCX</strong><small>Extension navigateur</small></div></header>
      <p>Sélectionne un texte sur la page, puis ouvre-le dans DEC DOCX.</p>
      <button id="selection">Copier la sélection et ouvrir</button>
      <button id="open" class="secondary">Ouvrir DEC DOCX</button>
      <p id="status" role="status"></p>
      <small>Le texte reste dans le presse-papiers de cet appareil. Colle-le dans la zone Contenu du chapitre.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
