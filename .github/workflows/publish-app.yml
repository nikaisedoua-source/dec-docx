name: Publish verified application
on:
  push:
    branches: [main]
    paths: ['lib/**', 'pubspec.yaml', 'web/**', 'public/**', 'word_addin/**', 'browser_extension/**', 'test/**', 'tool/prepare_release_assets.py', 'tool/version_web_assets.py', '.github/workflows/publish-app.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-application
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - run: python3 tool/prepare_release_assets.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/widget_test.dart test/cloud_storage_test.dart test/verse_editor_test.dart test/french_consistency_test.dart test/draft_session_test.dart
      - run: node --test test/cloud_storage_web_test.mjs test/app_bootstrap_test.mjs
      - run: flutter build web --release --base-href /dec-docx/
      - run: python3 tool/version_web_assets.py build/web
      - run: |
          cp -R public/. build/web/
          cp -R word_addin build/web/word-addin
          cd build/web && zip -qr ../../DEC-DOCX-Web.zip .
          cd ../.. && zip -qr DEC-DOCX-Word-Addin.zip word_addin
          zip -qr DEC-DOCX-Browser-Extension.zip browser_extension
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.13-preview
          name: DEC DOCX 1.9.13 — aperçu
          prerelease: true
          body: |
            Les chapitres similaires finaux en tchèque et les libellés traduits suivis de références Kc ne sont plus pris pour des versets.
            Interface en verre translucide, avis animé de nouvelle version et bouton d’installation discret adapté à l’appareil.
            Reconnaissance des dates tchèques et des jours suivis d’un point dans les sous-titres.
            Les mois encore inconnus dans une langue n’empêchent plus la génération si le jour et l’année concordent ; un avis demande de vérifier le mois.
            Les nombres des références bibliques restent dans leur verset, y compris avec des espaces autour des deux-points et des intervalles.
            Contrôle des dates des sous-titres avec la référence française, y compris entre deux versets.
            Suppression du blocage des références [Kc…] absentes ou différentes sur le site français.
            Les références saisies restent conservées dans le texte et le Word.
            Contrôles des dates, sous-titres et numéros de versets conservés.
            Prévention des titres de prédication placés comme sous-titres.
            Une référence française inaccessible ou incomplète bloque la génération sans modifier le texte.
            Brouillons automatiques récupérables et historique des versions locales.
            Bibliothèque hors ligne, copie de récupération en cas d’échec de synchronisation et animations accessibles.
            Le site web est utilisable sans installation. Les archives natives sont des versions de test.
            Android utilise une signature de test ; macOS et Windows ne sont pas signés pour distribution de confiance.
            Aucun document utilisateur n'est inclus dans ces fichiers.
          files: |
            DEC-DOCX-Web.zip
            DEC-DOCX-Word-Addin.zip
            DEC-DOCX-Browser-Extension.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - uses: actions/deploy-pages@v4
        id: deploy
  installers:
    needs: web
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            target: apk
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - run: python tool/prepare_release_assets.py
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release
      - name: Package Android
        if: matrix.target == 'apk'
        run: cp build/app/outputs/flutter-apk/app-release.apk DEC-DOCX-Android-preview.apk
      - name: Package macOS
        if: matrix.target == 'macos'
        run: ditto -c -k --keepParent 'build/macos/Build/Products/Release/DEC DOCX.app' DEC-DOCX-macOS-preview.zip
      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath DEC-DOCX-Windows-preview.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.13-preview
          prerelease: true
          files: |
            DEC-DOCX-Android-preview.apk
            DEC-DOCX-macOS-preview.zip
            DEC-DOCX-Windows-preview.zip
