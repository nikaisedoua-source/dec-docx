name: Restore DEC DOCX 1.9.17 preview installers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            target: apk
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e76fd5d92896c1e7874e7824a3727b06b095e1f1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - run: python tool/prepare_release_assets.py
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release
      - name: Package Android
        if: matrix.target == 'apk'
        run: cp build/app/outputs/flutter-apk/app-release.apk DEC-DOCX-Android-preview.apk
      - name: Package macOS
        if: matrix.target == 'macos'
        run: ditto -c -k --keepParent 'build/macos/Build/Products/Release/DEC DOCX.app' DEC-DOCX-macOS-preview.zip
      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath DEC-DOCX-Windows-preview.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.17-preview
          prerelease: true
          files: |
            DEC-DOCX-Android-preview.apk
            DEC-DOCX-macOS-preview.zip
            DEC-DOCX-Windows-preview.zip
